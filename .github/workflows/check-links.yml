name: Check links

on:
  schedule:
    - cron: '17 5 * * *' # every day at 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/check-links.mjs
      # Thumbnails for games that have none yet (for instance those of a merged proposal).
      - run: node scripts/fetch-covers.mjs
      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/status.json public/covers
          git diff --cached --quiet || git commit -m "Bot: link status and thumbnails"
          git push

  # A push made with the bot's token does not trigger Deploy, so it is called from here.
  deploy:
    needs: check
    uses: ./.github/workflows/deploy.yml
